spring.application.name=DevBoard

# H2 Database Configuration (in-memory, for development)
spring.datasource.url=jdbc:h2:file:./data/devboard_db
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

# Enable H2 Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Show Hibernate SQL queries in console (demonstrates ORM usage)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true